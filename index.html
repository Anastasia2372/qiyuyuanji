<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>七域源纪</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap');

:root {
  --bg-deep: #050510;
  --bg-mid: #0a0a18;
  --bg-card: #0f0f1c;
  --bg-card-hover: #15152a;
  --gold: #d4af37;
  --gold-light: #f0d878;
  --gold-dark: #8a7320;
  --blue-light: #a8d8ff;
  --blue-glow: #4488dd;
  --text-primary: #e8e0c8;
  --text-dim: #9a8e78;
  --text-muted: #6b6258;
  --border-glow: rgba(212, 175, 55, 0.3);
  --border-blue: rgba(168, 216, 255, 0.25);
  --glass-bg: rgba(15, 15, 28, 0.85);
  --glass-blur: 20px;
  --shadow-deep: 0 8px 40px rgba(0, 0, 0, 0.8);
  --shadow-glow-gold: 0 0 30px rgba(212, 175, 55, 0.2);
  --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100vh;
  font-family: 'ZCOOL XiaoWei', 'KaiTi', 'STKaiti', 'Microsoft YaHei', serif;
  color: var(--text-primary);
  background: var(--bg-deep);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* 主容器：填满自身 iframe 100vh100vw，不操作 parent body */
#qiyu-overlay {
  position: relative;
  width: 100%; height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at top left, rgba(68, 136, 221, 0.10) 0%, transparent 45%),
    radial-gradient(ellipse at bottom right, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
    linear-gradient(135deg, #050510 0%, #0a0a18 50%, #080812 100%);
  border: 1px solid var(--border-glow);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-deep), var(--shadow-glow-gold);
  animation: qiyu-bg-drift 30s ease-in-out infinite alternate;
}
@keyframes qiyu-bg-drift {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

/* 全屏模式时去掉边框圆角 */
:fullscreen #qiyu-overlay,
:-webkit-full-screen #qiyu-overlay {
  border: none;
  border-radius: 0;
}

/* 状态栏 */
#qiyu-status-bar {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px 16px;
  padding: 10px 16px;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(140%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(140%);
  border-bottom: 1px solid var(--border-glow);
  font-size: 0.8rem;
  letter-spacing: 0.04em;
}
#qiyu-status-bar > div {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-dim);
}
#qiyu-status-bar span { color: var(--gold-light); font-weight: 500; }

/* 顶栏右侧按钮：全屏切换 */
#qiyu-topbar-actions {
  position: absolute;
  top: 8px; right: 12px;
  display: flex; gap: 8px;
  z-index: 50;
}
.qiyu-topbar-btn {
  background: rgba(212, 175, 55, 0.12);
  border: 1px solid var(--border-glow);
  color: var(--gold-light);
  padding: 4px 10px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.2s;
}
.qiyu-topbar-btn:hover {
  background: var(--gold);
  color: var(--bg-deep);
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
}

/* 消息流 */
#qiyu-messages {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 16px clamp(12px, 3vw, 40px);
  scroll-behavior: smooth;
}
#qiyu-messages::-webkit-scrollbar { width: 6px; }
#qiyu-messages::-webkit-scrollbar-track { background: transparent; }
#qiyu-messages::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }

.qiyu-bubble {
  margin: 10px 0;
  padding: 10px 14px;
  border-radius: 10px;
  line-height: 1.7;
  font-size: 0.95rem;
  animation: qiyu-bubble-in 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes qiyu-bubble-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.qiyu-bubble.user {
  background: linear-gradient(135deg, rgba(168, 216, 255, 0.10) 0%, rgba(68, 136, 221, 0.08) 100%);
  border: 1px solid var(--border-blue);
  margin-left: auto;
  max-width: 70%;
  color: var(--blue-light);
}
.qiyu-bubble.ai {
  background: var(--glass-bg);
  border: 1px solid var(--border-glow);
  margin-right: auto;
  max-width: 85%;
  color: var(--text-primary);
  white-space: pre-wrap;
}
.qiyu-bubble.tutor {
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0.03) 100%);
  border: 1px dashed var(--gold);
  color: var(--gold-light);
  font-style: italic;
}
.qiyu-bubble strong, .qiyu-bubble b { color: var(--gold-light); }
.qiyu-bubble em, .qiyu-bubble i { color: var(--blue-light); }

/* 输入区 */
#qiyu-input-area {
  flex: 0 0 auto;
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-top: 1px solid var(--border-glow);
}
#qiyu-input {
  flex: 1 1 auto;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 0.9rem;
  resize: none;
  outline: none;
  transition: border var(--transition-smooth);
}
#qiyu-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
}
#qiyu-send, #qiyu-tutor {
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
  border: 1px solid var(--gold-light);
  color: var(--bg-deep);
  padding: 0 16px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  font-size: 0.85rem;
  transition: all var(--transition-smooth);
  white-space: nowrap;
}
#qiyu-tutor {
  background: linear-gradient(135deg, var(--blue-light) 0%, var(--blue-glow) 100%);
  border-color: var(--blue-light);
}
#qiyu-send:hover, #qiyu-tutor:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(212, 175, 55, 0.4);
}

/* FAB 悬浮球 */
.qiyu-fab {
  position: absolute;
  width: 50px; height: 50px;
  right: 16px; bottom: 76px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
  border: 2px solid var(--gold-light);
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(212, 175, 55, 0.4), 0 0 30px rgba(212, 175, 55, 0.2);
  z-index: 100;
  outline: none;
  user-select: none;
  touch-action: none;
  transition: box-shadow var(--transition-smooth);
  will-change: transform;
}
.qiyu-fab:hover {
  box-shadow: 0 6px 22px rgba(212, 175, 55, 0.6), 0 0 50px rgba(212, 175, 55, 0.35);
}
.qiyu-fab.dragging { transition: none !important; }
.qiyu-fab-inner {
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
  box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
  animation: qiyu-fab-pulse 2.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes qiyu-fab-pulse {
  0%, 100% { box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(212, 175, 55, 0.6); }
  50% { box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3), 0 0 0 8px rgba(212, 175, 55, 0); }
}

/* 菜单 */
.qiyu-menu {
  position: absolute;
  width: 220px; max-height: 70vh;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--border-glow);
  border-radius: 12px;
  padding: 6px;
  box-shadow: var(--shadow-deep), var(--shadow-glow-gold);
  z-index: 99;
  transition: opacity var(--transition-smooth), transform var(--transition-smooth);
  transform-origin: bottom right;
}
.qiyu-menu.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.85) translateY(8px);
}
.qiyu-menu ul {
  list-style: none; margin: 0; padding: 0;
  overflow-y: auto;
  max-height: calc(70vh - 12px);
}
.qiyu-menu li {
  padding: 9px 14px;
  color: var(--text-primary);
  cursor: pointer;
  border-radius: 6px;
  transition: background 0.2s, color 0.2s, padding-left 0.2s;
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  border-left: 2px solid transparent;
}
.qiyu-menu li:hover {
  background: linear-gradient(90deg, rgba(212, 175, 55, 0.18) 0%, rgba(212, 175, 55, 0.05) 100%);
  color: var(--gold-light);
  padding-left: 18px;
  border-left-color: var(--gold);
}

/* 13 个面板 */
.qiyu-panel {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: clamp(280px, 80%, 600px);
  max-height: 80%;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--border-glow);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow-deep), var(--shadow-glow-gold);
  z-index: 110;
  display: flex;
  flex-direction: column;
  transition: opacity var(--transition-smooth), transform var(--transition-smooth);
}
.qiyu-panel.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%) scale(0.92);
}
.qiyu-panel h2 {
  margin: 0 0 12px 0;
  padding-bottom: 10px;
  font-family: 'Ma Shan Zheng', 'KaiTi', cursive;
  font-size: 1.4rem;
  font-weight: normal;
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--blue-light) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 0.1em;
  border-bottom: 1px solid var(--border-glow);
  animation: qiyu-shimmer 4s linear infinite;
}
@keyframes qiyu-shimmer {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}
.qiyu-panel-close {
  position: absolute;
  top: 12px; right: 12px;
  width: 26px; height: 26px;
  border: 1px solid var(--border-glow);
  background: transparent;
  color: var(--text-dim);
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.qiyu-panel-close:hover {
  color: var(--gold-light);
  border-color: var(--gold);
}
.qiyu-panel-body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding-right: 6px;
}
.qiyu-panel-body::-webkit-scrollbar { width: 4px; }
.qiyu-panel-body::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 2px; }

.qiyu-data-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px dashed rgba(212, 175, 55, 0.1);
  font-size: 0.9rem;
}
.qiyu-data-row .key { color: var(--text-dim); }
.qiyu-data-row .val { color: var(--gold-light); font-weight: 500; }
.qiyu-data-row.heading {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border-glow);
  border-bottom: none;
  color: var(--blue-light);
  font-weight: 500;
}
.qiyu-empty {
  text-align: center;
  padding: 30px 16px;
  color: var(--text-muted);
  font-style: italic;
  font-size: 0.85rem;
}

.qiyu-action-row {
  display: flex; gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.qiyu-action-btn {
  padding: 5px 12px;
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(168, 216, 255, 0.1) 100%);
  border: 1px solid rgba(212, 175, 55, 0.4);
  color: var(--gold-light);
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: all 0.2s;
}
.qiyu-action-btn:hover {
  background: var(--gold);
  color: var(--bg-deep);
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
}

/* 难度面板 */
.qiyu-difficulty-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.qiyu-difficulty-card {
  padding: 12px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: 8px;
  cursor: pointer;
  transition: all var(--transition-smooth);
}
.qiyu-difficulty-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--gold);
}
.qiyu-difficulty-card.active {
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
  border-color: var(--gold-light);
  box-shadow: var(--shadow-glow-gold);
}
.qiyu-difficulty-card h3 {
  margin: 0 0 5px 0;
  font-size: 1rem;
  color: var(--gold-light);
  font-family: 'Ma Shan Zheng', cursive;
  font-weight: normal;
  letter-spacing: 0.1em;
}
.qiyu-difficulty-card p {
  margin: 0;
  font-size: 0.8rem;
  color: var(--text-dim);
  line-height: 1.5;
}

@media (max-width: 600px) {
  #qiyu-status-bar { grid-template-columns: 1fr 1fr; font-size: 0.72rem; padding: 8px 12px; }
  .qiyu-fab { width: 44px; height: 44px; right: 12px; bottom: 70px; }
  .qiyu-menu { width: calc(100% - 24px); max-width: 260px; }
  #qiyu-input-area { padding: 8px 12px; }
  #qiyu-send, #qiyu-tutor { padding: 0 10px; font-size: 0.8rem; }
}
</style>
</head>
<body>

<div id="qiyu-overlay">

  <header id="qiyu-status-bar">
    <div>领主 <span id="qiyu-stat-name">未定</span></div>
    <div>阶级 <span id="qiyu-stat-level">凡人</span></div>
    <div>势力 <span id="qiyu-stat-faction">未定</span></div>
    <div>位置 <span id="qiyu-stat-loc">未定</span></div>
    <div>时辰 <span id="qiyu-stat-time">未定</span></div>
    <div>季节 <span id="qiyu-stat-season">未定</span></div>
    <div>难度 <span id="qiyu-stat-difficulty">星衡</span></div>
    <div>天元 <span id="qiyu-stat-tianyuan">石0/玉0/晶0/源0</span></div>
  </header>

  <div id="qiyu-topbar-actions">
    <button class="qiyu-topbar-btn" id="qiyu-fullscreen-btn" title="切换全屏">全屏</button>
  </div>

  <main id="qiyu-messages"></main>

  <footer id="qiyu-input-area">
    <textarea id="qiyu-input" placeholder="输入消息（Enter 发送, Shift+Enter 换行）..." rows="2"></textarea>
    <button id="qiyu-tutor" title="问游戏机制">问机制</button>
    <button id="qiyu-send">发送</button>
  </footer>

  <button id="qiyu-fab" class="qiyu-fab" aria-label="七域菜单">
    <span class="qiyu-fab-inner"></span>
  </button>

  <nav id="qiyu-menu" class="qiyu-menu hidden">
    <ul id="qiyu-menu-list"></ul>
  </nav>

  <!-- 13 个面板由 JS 动态创建到 #qiyu-panel-host -->
  <div id="qiyu-panel-host"></div>

</div>

<script>
(function() {
  'use strict';

  // ============================================================
  // parent 引用（仅用于读 ST API，不操作 parent body）
  // ============================================================
  let P;
  try { P = window.parent || window; } catch(_) { P = window; }
  const log = (...a) => console.log('[七域]', ...a);

  // ============================================================
  // ST API 访问
  // ============================================================
  function getCtx() {
    try { return P.SillyTavern && P.SillyTavern.getContext && P.SillyTavern.getContext(); } catch(_) { return null; }
  }
  function getStatData() {
    try {
      if (typeof P.getAllVariables === 'function') return P.getAllVariables()?.stat_data || {};
    } catch(_) {}
    const ctx = getCtx();
    return (ctx && ctx.variables && ctx.variables.global && ctx.variables.global.stat_data)
        || (ctx && ctx.chatMetadata && ctx.chatMetadata.variables && ctx.chatMetadata.variables.stat_data)
        || {};
  }
  function getChat() {
    const ctx = getCtx();
    return (ctx && ctx.chat) || P.chat || [];
  }
  function extractGametxt(text) {
    if (!text) return '';
    const m = text.match(/<gametxt>([\s\S]*?)<\/gametxt>/);
    if (m) return m[1].trim();
    return text.replace(/<UpdateVariable>[\s\S]*?<\/UpdateVariable>/g, '').trim();
  }
  function isTutorReply(text) {
    return !text.includes('<gametxt>') && !text.includes('<UpdateVariable>');
  }
  function escHTML(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function fmtMd(text) {
    return escHTML(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  // ============================================================
  // 13 面板配置
  // ============================================================
  const PANEL_LIST = [
    ['player', '玩家面板'], ['companions', '同伴面板'], ['island', '空岛面板'],
    ['subjob', '副职面板'], ['fishing', '钓鱼'], ['farming', '种地'],
    ['events', '世界事件'], ['reputation', '声望阵营'], ['dynamics', '动态面板'],
    ['encyclopedia', '图鉴'], ['difficulty', '难度切换'], ['tutor', '教学助手'],
    ['settings', '设置']
  ];

  // ============================================================
  // 渲染辅助
  // ============================================================
  function dr(k, v) { return '<div class="qiyu-data-row"><span class="key">' + escHTML(k) + '</span><span class="val">' + escHTML(v ?? '-') + '</span></div>'; }
  function dh(t) { return '<div class="qiyu-data-row heading">' + escHTML(t) + '</div>'; }
  function empty(t) { return '<div class="qiyu-empty">' + t + '</div>'; }
  function actBtn(label, action, dataAttr) {
    let attrs = 'data-action="' + action + '"';
    if (dataAttr) {
      for (const k in dataAttr) attrs += ' data-' + k + '="' + escHTML(dataAttr[k]) + '"';
    }
    return '<button class="qiyu-action-btn" ' + attrs + '>' + escHTML(label) + '</button>';
  }
  function btnRow(html) { return '<div class="qiyu-action-row">' + html + '</div>'; }

  // ============================================================
  // 13 面板渲染
  // ============================================================
  function renderPanelContent(id, s) {
    const renders = {
      player: function() {
        const m = s.主角 || {}, t = m.天元 || {}, e = m.装备 || {};
        let html = dr('姓名', m.姓名) + dr('性别', m.性别) + dr('年龄', m.年龄) + dr('血脉', m.血脉)
          + dr('当前阶级', m.当前阶级) + dr('当前势力', m.当前势力)
          + dr('源石阶印记', m.源石阶印记 || '未认证') + dr('契约物品', m.契约物品)
          + dh('天元')
          + dr('石质', t.石质天元 ?? 0) + dr('玉质', t.玉质天元 ?? 0) + dr('晶质', t.晶质天元 ?? 0)
          + dr('源质', t.源质天元 ?? 0) + dr('渊骨币', t.渊骨币 ?? 0)
          + dh('装备')
          + dr('头部', e.头部) + dr('胸部', e.胸部) + dr('腿部', e.腿部) + dr('脚部', e.脚部) + dr('武器', e.武器);
        if (m.宿命) {
          html += dh('宿命');
          if (typeof m.宿命 === 'object') {
            html += dr('名号', m.宿命.name);
            if (m.宿命.desc) html += dr('描述', m.宿命.desc.length > 60 ? m.宿命.desc.substring(0, 60) + '...' : m.宿命.desc);
          } else html += dr('宿命', m.宿命);
        }
        return html;
      },
      companions: function() {
        const c = s.同伴 || {}, ent = c.entries || {};
        const arr = Object.values(ent).filter(v => v && typeof v === 'object' && v.id);
        let html = btnRow(actBtn('孵新蛋', 'hatch_egg'));
        if (!arr.length) { html += empty('还没有契约同伴。<br>点上方"孵新蛋"开启同伴之旅。'); return html; }
        html += arr.map(c => dh(c.名字 + ' (' + (c.种族 || '未知') + ')')

  function showPanel(id) {
    document.querySelectorAll('.qiyu-panel').forEach(p => p.classList.add('hidden'));

    if (!panel) return;

  // ============================================================
  // FAB + 菜单
  // ============================================================
  function setupFab() {
    const fab = document.getElementById('qiyu-fab');
    const menu = document.getElementById('qiyu-menu');
    if (!fab || !menu) return;
    let isDragging = false, didMove = false, startX, startY, fabX, fabY;

    try {
      const saved = JSON.parse(localStorage.getItem('qiyu_fab_pos_v3') || 'null');
      if (saved) { fab.style.left = saved.x + 'px'; fab.style.top = saved.y + 'px'; fab.style.right = 'auto'; fab.style.bottom = 'auto'; }
    } catch(_) {}

    fab.addEventListener('pointerdown', (e) => {
      isDragging = true; didMove = false;
      const rect = fab.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY; fabX = rect.left; fabY = rect.top;
      fab.classList.add('dragging');
      try { fab.setPointerCapture(e.pointerId); } catch(_) {}
      e.preventDefault();
    });
    document.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) didMove = true;
      if (didMove) {
        const newX = Math.max(0, Math.min(window.innerWidth - fab.offsetWidth, fabX + dx));
        const newY = Math.max(0, Math.min(window.innerHeight - fab.offsetHeight, fabY + dy));
        fab.style.transform = 'translate3d(' + (newX - fabX) + 'px, ' + (newY - fabY) + 'px, 0)';
      }
    });
    document.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      fab.classList.remove('dragging');
      if (!didMove) {
        if (menu.classList.contains('hidden')) { positionMenu(); menu.classList.remove('hidden'); }
        else menu.classList.add('hidden');
      } else {
        const rect = fab.getBoundingClientRect();
        fab.style.left = rect.left + 'px'; fab.style.top = rect.top + 'px';
        fab.style.right = 'auto'; fab.style.bottom = 'auto';
        fab.style.transform = '';
        try { localStorage.setItem('qiyu_fab_pos_v3', JSON.stringify({x: rect.left, y: rect.top})); } catch(_) {}
      }
    });

    function positionMenu() {
      const r = fab.getBoundingClientRect();
      const w = 220;
      let left = r.right - w; if (left < 8) left = 8;
      let top = r.top - Math.min(window.innerHeight * 0.7, 400) - 10;
      if (top < 8) top = r.bottom + 10;
      menu.style.left = left + 'px'; menu.style.top = top + 'px';
      menu.style.right = 'auto'; menu.style.bottom = 'auto';
    }

    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== fab && !fab.contains(e.target) && !e.target.closest('.qiyu-panel')) {
        menu.classList.add('hidden');
      }
    });
    menu.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', (e) => {
        e.stopPropagation();
        showPanel(li.dataset.panel);
        menu.classList.add('hidden');
      });
    });
    document.querySelectorAll('.qiyu-panel-close').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('.qiyu-panel').classList.add('hidden'));
    });
  }

  // ============================================================
  // 面板内交互绑定
  // ============================================================
  function bindPanelInteractions(panelId, panel) {
    panel.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = el.dataset.action;
        const data = Object.assign({}, el.dataset);
        delete data.action;
        handleAction(action, data, panel);
      });
    });
    if (panelId === 'tutor') {
      const ta = panel.querySelector('#qiyu-tutor-input');
      if (ta) ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleAction('tutor_ask', {}, panel); }
      });
    }
  }

  // ============================================================
  // 操作处理
  // ============================================================
  function handleAction(action, data, panel) {
    log('action:', action, data);
    switch (action) {
      case 'diff_switch': switchDifficulty(data.diff).then(() => {
        if (panel) {
          panel.querySelector('.qiyu-panel-body').innerHTML = renderPanelContent('difficulty', getStatData());
          bindPanelInteractions('difficulty', panel);
        }
        refreshState();
      }); break;
      case 'hatch_egg': sendMsg('[孵蛋] 我要从源鼎孵化新蛋。'); break;
      case 'comp_interact': sendMsg('[同伴互动] ' + data.name); break;
      case 'comp_detail': sendMsg('[同伴详情] ' + data.name); break;
      case 'island_buy': sendMsg('[购置空岛] 我要从皇室购入空岛。'); break;
      case 'island_upgrade': sendMsg('[升级空岛规模]'); break;
      case 'island_manage_industry': sendMsg('[空岛产业管理]'); break;
      case 'island_handle_crisis': sendMsg('[处理空岛危机]'); break;
      case 'subjob_train': sendMsg('[修炼副职] ' + data.name); break;
      case 'fish_ground': sendMsg('[钓鱼·地面] 我要去地面水域钓鱼。'); break;
      case 'fish_island': sendMsg('[钓鱼·空岛] 我要在空岛钓鱼。'); break;
      case 'fish_upgrade_rod': sendMsg('[升级鱼竿]'); break;
      case 'fish_buy_bait': sendMsg('[购买饵料]'); break;
      case 'farm_new_field': sendMsg('[开垦新田]'); break;
      case 'farm_plant': sendMsg('[种植作物]'); break;
      case 'farm_field_view': sendMsg('[查看田地] 第' + data.idx + '块'); break;
      case 'farm_harvest': sendMsg('[收获] 第' + data.idx + '块田地'); break;
      case 'event_track': sendMsg('[追踪事件] ' + data.name); break;
      case 'event_intervene': sendMsg('[介入事件] ' + data.name); break;
      case 'rep_detail': sendMsg('[势力详情] ' + data.faction + '（' + data.group + '）'); break;
      case 'dyn_refresh': sendMsg('[刷新世界动态]'); break;
      case 'enc_browse': sendMsg('[浏览图鉴] ' + data.group); break;
      case 'tutor_ask': {
        const ta = document.getElementById('qiyu-tutor-input');
        if (!ta) return;
        const t = ta.value.trim();
        if (!t) { alert('请输入要问的机制问题'); return; }
        sendMsg('[教学问询] ' + t);
        ta.value = '';
        break;
      }
      case 'set_font_dec': adjustFont(-1); break;
      case 'set_font_inc': adjustFont(1); break;
      case 'set_font_reset': adjustFont(0); break;
      case 'set_fab_reset': resetFab(); break;
      case 'set_anim_toggle': toggleBgAnim(); break;
      default: log('未知 action:', action);
    }
  }

  // ============================================================
  // 难度切换：改 stat_data + 切 lorebook
  // ============================================================
  async function switchDifficulty(target) {
    if (!target) return;
    const NAMES = ['难度·星眷', '难度·星衡', '难度·星弃', '难度·星裁'];
    const targetName = '难度·' + target;
    try {
      if (P.Mvu && typeof P.Mvu.replaceMvuData === 'function') {
        const lid = (typeof P.getLastMessageId === 'function') ? P.getLastMessageId() : 0;
        const data = (P.Mvu.getMvuData ? P.Mvu.getMvuData({ type:'message', message_id: lid }) : {}) || {};
        if (!data.stat_data) data.stat_data = {};
        data.stat_data.难度模式 = target;
        await P.Mvu.replaceMvuData(data, { type:'message', message_id: lid });
      }
    } catch(e) { log('改 难度模式 失败:', e); }
    try {
      if (typeof P.getCharWorldbookNames === 'function' && typeof P.getWorldbook === 'function' && typeof P.replaceWorldbook === 'function') {
        const wbSet = new Set();
        const charWB = P.getCharWorldbookNames('current') || {};
        if (charWB.primary) wbSet.add(charWB.primary);
        if (Array.isArray(charWB.additional)) charWB.additional.forEach(n => n && wbSet.add(n));
        for (const wbName of wbSet) {
          let entries;
          try { entries = await P.getWorldbook(wbName); } catch(_) { continue; }
          let changed = false;
          const updated = entries.map(e => {
            const name = String(e && e.name || '');
            if (!NAMES.includes(name)) return e;
            const should = name === targetName;
            if (e.enabled !== should) { changed = true; return Object.assign({}, e, { enabled: should }); }
            return e;
          });
          if (changed) await P.replaceWorldbook(wbName, updated);
        }
      }
    } catch(e) { log('切 lorebook 失败:', e); }
    log('难度已切换:', target);
  }

  // ============================================================
  // 发消息（模拟 ST 主页面输入框 + 发送按钮）
  // ============================================================
  function findSTInput() {
    const sels = ['#send_textarea', 'textarea#send_textarea', '#prompt-input', '[id*="send_textarea"]', 'textarea[placeholder*="message" i]', 'textarea[placeholder*="消息"]'];
    for (const s of sels) {
      try { const el = (P.document || document).querySelector(s); if (el) return el; } catch(_) {}
    }
    return null;
  }
  function findSTSend() {
    const sels = ['#send_but', 'button#send_but', '[id*="send_but"]', '#send-button', 'div[id="send_but"]', 'button.send_but'];
    for (const s of sels) {
      try { const el = (P.document || document).querySelector(s); if (el) return el; } catch(_) {}
    }
    return null;
  }
  function sendMsg(text) {
    text = text.trim();
    if (!text) return;
    const stInput = findSTInput();
    const stSend = findSTSend();
    if (stInput && stSend) {
      stInput.value = text;
      stInput.dispatchEvent(new Event('input', { bubbles: true }));
      setTimeout(() => stSend.click(), 50);
      return;
    }
    try {
      const ctx = getCtx();
      if (ctx && ctx.executeSlashCommands) { ctx.executeSlashCommands('/send ' + text); return; }
    } catch(_) {}
    alert('找不到 SillyTavern 输入框。');
  }

  // ============================================================
  // 设置面板：字号 / FAB / 背景动画
  // ============================================================
  function adjustFont(delta) {
    const overlay = document.getElementById('qiyu-overlay');
    if (!overlay) return;
    const cur = parseFloat(overlay.style.fontSize) || 16;
    const next = delta === 0 ? 16 : Math.max(12, Math.min(24, cur + delta));
    overlay.style.fontSize = next + 'px';
    try { localStorage.setItem('qiyu_font_size_v3', next); } catch(_) {}
  }
  function resetFab() {
    const fab = document.getElementById('qiyu-fab');
    if (!fab) return;
    fab.style.left = ''; fab.style.top = '';
    fab.style.right = '16px'; fab.style.bottom = '76px';
    try { localStorage.removeItem('qiyu_fab_pos_v3'); } catch(_) {}
    log('FAB 已重置');
  }
  function toggleBgAnim() {
    const overlay = document.getElementById('qiyu-overlay');
    if (!overlay) return;
    const cur = overlay.style.animationPlayState || 'running';
    overlay.style.animationPlayState = cur === 'running' ? 'paused' : 'running';
    log('背景动画:', overlay.style.animationPlayState);
  }

  // ============================================================
  // 全屏切换
  // ============================================================
  function setupFullscreen() {
    const btn = document.getElementById('qiyu-fullscreen-btn');
    if (!btn) return;
    btn.addEventListener('click', () => {
      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      if (isFull) {
        try {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } catch(_) {}
      } else {
        const root = document.documentElement;
        try {
          if (root.requestFullscreen) root.requestFullscreen();
          else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
        } catch(e) {
          alert('全屏失败：iframe 可能没有 allowfullscreen 权限。\n按 F11 全屏整个浏览器代替。');
        }
      }
    });
    document.addEventListener('fullscreenchange', updateFullscreenBtn);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);
    function updateFullscreenBtn() {
      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      btn.textContent = isFull ? '还原' : '全屏';
    }
  }

  // ============================================================
  // 状态栏 + 消息流刷新
  // ============================================================
  function refreshState() {
    const stat = getStatData();
    const m = stat.主角 || {}, t = m.天元 || {};
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v ?? '未定'; };
    set('qiyu-stat-name', m.姓名 || '未定');
    set('qiyu-stat-level', m.当前阶级 || '凡人');
    set('qiyu-stat-faction', m.当前势力 || '未定');
    set('qiyu-stat-loc', stat.大区域 || '未定');
    set('qiyu-stat-time', stat.时辰 || '未定');
    set('qiyu-stat-season', stat.季节 || '未定');
    set('qiyu-stat-difficulty', stat.难度模式 || '星衡');
    set('qiyu-stat-tianyuan', '石' + (t.石质天元 ?? 0) + '/玉' + (t.玉质天元 ?? 0) + '/晶' + (t.晶质天元 ?? 0) + '/源' + (t.源质天元 ?? 0));

    const openPanel = document.querySelector('.qiyu-panel:not(.hidden)');
    if (openPanel) {
      const id = openPanel.dataset.panelId;
      const body = openPanel.querySelector('.qiyu-panel-body');
      if (body) {
        body.innerHTML = renderPanelContent(id, stat);
        bindPanelInteractions(id, openPanel);
      }
    }
  }

  let lastChatLen = -1;
  function refreshMessages() {
    const el = document.getElementById('qiyu-messages');
    if (!el) return;
    const chat = getChat();
    if (chat.length === lastChatLen && el.children.length === chat.length) return;
    lastChatLen = chat.length;
    el.innerHTML = chat.map(msg => {
      const text = extractGametxt(msg.mes);
      if (!text) return '';
      const cls = msg.is_user ? 'user' : (isTutorReply(msg.mes) ? 'tutor' : 'ai');
      return '<div class="qiyu-bubble ' + cls + '">' + fmtMd(text) + '</div>';
    }).join('');
    el.scrollTop = el.scrollHeight;
  }

  // ============================================================
  // 输入框
  // ============================================================
  function setupInput() {
    const input = document.getElementById('qiyu-input');
    const sendBtn = document.getElementById('qiyu-send');
    const tutorBtn = document.getElementById('qiyu-tutor');
    if (!input || !sendBtn) return;
    sendBtn.addEventListener('click', () => { sendMsg(input.value); input.value = ''; });
    if (tutorBtn) tutorBtn.addEventListener('click', () => {
      const t = input.value.trim();
      if (!t) { alert('请先输入要问的机制问题'); return; }
      sendMsg('[教学问询] ' + t);
      input.value = '';
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(input.value); input.value = ''; }
    });
  }

  // ============================================================
  // ST 事件订阅
  // ============================================================
  function setupSTEvents() {
    function tryListen(ev, h) {
      try {
        if (typeof P.eventOn === 'function') { P.eventOn(ev, h); return true; }
        const ctx = getCtx();
        if (ctx && ctx.eventSource && ctx.eventSource.on) { ctx.eventSource.on(ev, h); return true; }
      } catch(_) {}
      return false;
    }
    if (P.Mvu && P.Mvu.events) tryListen(P.Mvu.events.VARIABLE_UPDATE_ENDED || 'mag_variable_update_ended', refreshState);
    tryListen('MESSAGE_RECEIVED', () => { refreshMessages(); refreshState(); });
    tryListen('MESSAGE_SENT', () => refreshMessages());
    tryListen('CHAT_CHANGED', () => { refreshMessages(); refreshState(); });
    tryListen('character_message_rendered', () => { refreshMessages(); refreshState(); });
    setInterval(() => { refreshState(); refreshMessages(); }, 2500);
  }

  // ============================================================
  // 入口
  // ============================================================
  function init() {
    log('七域 v3 自包含 UI 启动（不操作 parent body）');
    buildMenuAndPanels();
    // 恢复字号
    try {
      const fs = parseFloat(localStorage.getItem('qiyu_font_size_v3'));
      if (fs) {
        const overlay = document.getElementById('qiyu-overlay');
        if (overlay) overlay.style.fontSize = fs + 'px';
      }
    } catch(_) {}
    setupFab();
    setupInput();
    setupFullscreen();
    refreshState();
    refreshMessages();
    setupSTEvents();
    log('伪零层 UI v3 加载完成（小窗口模式 + 手动全屏）');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
