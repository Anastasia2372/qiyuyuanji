<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>七域源纪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Anastasia2372/qiyuyuanji@main/style.css">
</head>
<body>
  <div id="qiyu-container">
    <div class="qiyu-bg"></div>
    <div class="qiyu-particles" aria-hidden="true">
      <span class="p"></span><span class="p"></span><span class="p"></span>
      <span class="p"></span><span class="p"></span><span class="p"></span>
      <span class="p"></span><span class="p"></span>
    </div>

    <main id="qiyu-main">
      <div class="qiyu-loading">
        <h1 class="qiyu-title">七域源纪</h1>
        <p class="qiyu-subtitle">伪零层 UI 框架已加载 · 等待状态注入</p>
        <p class="qiyu-hint">阶段一骨架版 · 后续会填充具体玩法面板</p>
      </div>
    </main>

    <button id="qiyu-fab" class="qiyu-fab" aria-label="七域菜单">
      <span class="qiyu-fab-inner"></span>
    </button>

    <nav id="qiyu-menu" class="qiyu-menu hidden" aria-hidden="true">
      <ul>
        <li data-panel="player">玩家面板</li>
        <li data-panel="companions">同伴面板</li>
        <li data-panel="island">空岛面板</li>
        <li data-panel="subjob">副职面板</li>
        <li data-panel="fishing">钓鱼</li>
        <li data-panel="farming">种地</li>
        <li data-panel="events">世界事件</li>
        <li data-panel="reputation">声望阵营</li>
        <li data-panel="dynamics">动态面板</li>
        <li data-panel="difficulty">难度切换</li>
        <li data-panel="tutor">教学助手</li>
        <li data-panel="settings">设置</li>
      </ul>
    </nav>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/Anastasia2372/qiyuyuanji@main/main.js"></script>
</body>
</html>
